<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dino Rage · Arena de clicks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--anger:0;--ink:#fff0e0;--panel:rgba(20,10,36,.72);--line:rgba(255,200,150,.16)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);overflow:hidden;
 background:
  radial-gradient(900px 700px at 62% 95%,color-mix(in srgb,#ff3b1a calc(var(--anger)*60%),#4b1b63) 0%,transparent 70%),
  linear-gradient(160deg,#130a26,#2b1140 55%,#3a1422);transition:background .6s}
.app{display:grid;grid-template-columns:320px 1fr;grid-template-rows:auto 1fr;height:100dvh}
header{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.logo{font-weight:800;font-size:26px;letter-spacing:.5px;background:linear-gradient(90deg,#ffd36b,#ff7a1a,#ff3b3b);-webkit-background-clip:text;background-clip:text;color:transparent}
.chip{font-size:14px;padding:4px 12px;border:1px solid var(--line);border-radius:99px;background:rgba(255,255,255,.05)}
.sp{flex:1}
button{font:inherit;color:inherit;cursor:pointer}
.ibtn{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:10px;padding:4px 10px}
.ibtn:hover{background:rgba(255,255,255,.14)}
#rank{padding:14px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:10px;overflow:hidden}
#rank h2{font-size:19px;display:flex;align-items:center;gap:8px}
#rank small{opacity:.65;font-size:12px}
#rankList{position:relative;flex:1;min-height:0}
.row{position:absolute;left:0;right:0;height:50px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:12px;
 background:rgba(255,255,255,.05);border:1px solid transparent;transition:transform .55s cubic-bezier(.2,.9,.2,1),background .3s;overflow:hidden}
.row.me{background:linear-gradient(90deg,rgba(255,122,26,.28),rgba(255,122,26,.08));border-color:rgba(255,160,80,.6)}
.row .bar{position:absolute;left:0;bottom:0;height:3px;background:linear-gradient(90deg,#ffd36b,#ff4b2b);transition:width .5s}
.row .pos{width:26px;text-align:center;font-weight:800;font-size:17px}
.row .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#2a0f00;flex:none}
.row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.row .ct{font-weight:800;font-variant-numeric:tabular-nums}
.row.bump{background:rgba(255,200,100,.28)}
#you{font-size:14px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.06);border:1px dashed var(--line);line-height:1.25}
#mode{font-size:11px;opacity:.6}
main{position:relative;min-width:0;min-height:0}
#stage{position:absolute;inset:0;display:grid;place-items:center}
#svg{height:100%;max-height:calc(100dvh - 110px);width:auto;max-width:100%;touch-action:manipulation;user-select:none;-webkit-user-select:none;overflow:visible}
#fx{position:absolute;inset:0;pointer-events:none}
.part{transform-box:fill-box;transform-origin:center;cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='34' height='34'><text y='26' font-size='26'>👊</text></svg>") 17 17,pointer}
.part:hover>.shape{filter:brightness(1.1)}
.shape{transform-box:fill-box;transform-origin:center;transition:transform .8s cubic-bezier(.2,.9,.2,1)}
.dmg [data-min]{opacity:0;transition:opacity .45s}
#dino{transform-origin:300px 660px;animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.008,1.018) translateY(-2px)}}
.tailsway{transform-origin:392px 510px;animation:sway 3.6s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(3.5deg)}}
.flame{transform-origin:476px 640px;animation:flick .45s ease-in-out infinite alternate}
@keyframes flick{0%{transform:scale(1,1) skewX(-2deg)}100%{transform:scale(.94,1.12) skewX(3deg)}}
.eyeball{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
.steam circle{animation:rise 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
.steam circle:nth-child(2){animation-delay:.5s}.steam circle:nth-child(3){animation-delay:.9s}.steam circle:nth-child(4){animation-delay:1.2s}
@keyframes rise{0%{transform:translateY(0) scale(.4);opacity:.8}100%{transform:translateY(-46px) scale(1.7);opacity:0}}
.spikes{transform-origin:300px 150px;transition:transform .8s cubic-bezier(.3,1.6,.4,1),opacity .6s}
#hud{position:absolute;top:10px;left:0;right:0;display:flex;flex-direction:column;align-items:center;pointer-events:none;gap:2px}
#total{font-size:44px;font-weight:800;line-height:1;text-shadow:0 3px 0 #7d2209,0 0 24px rgba(255,120,30,.6)}
#total small{display:block;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;opacity:.7;text-shadow:none;text-align:center}
#combo{font-size:26px;font-weight:800;color:#ffd36b;opacity:0;transition:opacity .2s;text-shadow:0 2px 0 #7d2209}
#combo.on{opacity:1;animation:pulse .25s}
@keyframes pulse{50%{transform:scale(1.25)}}
#bubble{position:absolute;top:104px;left:50%;transform:translateX(-50%) scale(.9);opacity:0;background:#fff7e6;color:#4a1a05;padding:7px 16px;border-radius:18px;font-weight:800;font-size:18px;white-space:nowrap;
 border:3px solid #7d2209;transition:.2s;pointer-events:none;z-index:3}
#bubble.on{opacity:1;transform:translateX(-50%) scale(1)}
#bubble:after{content:"";position:absolute;left:50%;bottom:-12px;width:16px;height:16px;background:#fff7e6;border-right:3px solid #7d2209;border-bottom:3px solid #7d2209;transform:translateX(-50%) rotate(45deg)}
.float{position:absolute;pointer-events:none;font-weight:800;color:#fff;text-shadow:0 2px 0 #7d2209,0 0 10px rgba(255,140,40,.9);animation:fl .9s ease-out forwards;z-index:4;white-space:nowrap}
@keyframes fl{0%{transform:translate(-50%,0) scale(.5);opacity:0}15%{transform:translate(-50%,-10px) scale(1.2);opacity:1}100%{transform:translate(-50%,-90px) scale(1);opacity:0}}
#tip{position:absolute;pointer-events:none;background:rgba(10,5,20,.85);padding:4px 10px;border-radius:8px;font-size:13px;border:1px solid var(--line);opacity:0;transition:opacity .15s;z-index:5;white-space:nowrap}
#toast{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:6;pointer-events:none}
.t{background:linear-gradient(90deg,#ffb347,#ff7a1a);color:#3a1200;font-weight:800;padding:8px 14px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:tin .4s cubic-bezier(.2,1.4,.4,1),tout .4s 3s forwards}
@keyframes tin{from{transform:translateX(120%)}}@keyframes tout{to{opacity:0;transform:translateY(10px)}}
#legend{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:12px;opacity:.55;pointer-events:none}
#modal{position:fixed;inset:0;background:rgba(10,4,20,.82);backdrop-filter:blur(8px);display:grid;place-items:center;z-index:20}
#modal form{background:#2a1340;border:1px solid var(--line);border-radius:20px;padding:28px;width:min(92vw,380px);text-align:center;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#modal h1{font-size:30px}#modal p{opacity:.75;font-size:15px}
#modal input{font:inherit;font-size:20px;text-align:center;padding:10px;border-radius:12px;border:2px solid #ff7a1a;background:#190b2a;color:#fff}
#modal .go{background:linear-gradient(180deg,#ffb347,#ff6a1a);border:0;border-radius:14px;padding:12px;font-weight:800;font-size:20px;color:#3a1200;box-shadow:0 5px 0 #a8420c}
@media(max-width:820px){
 .app{grid-template-columns:1fr;grid-template-rows:auto 190px 1fr}
 header{grid-column:1}#rank{grid-row:2;border-right:0;border-bottom:1px solid var(--line);padding:8px 12px}
 #rank h2{font-size:16px}#you{display:none}.row{height:44px}
 #total{font-size:34px}#bubble{top:84px}
}
@media(prefers-reduced-motion:reduce){#dino,.tailsway,.flame,.eyeball{animation:none}}
</style>
</head>
<body>
<div class="app">
 <header>
  <div class="logo">DINO RAGE</div>
  <div class="chip" id="chipNick">—</div>
  <div class="chip" id="chipStreak">🔥 Racha: 1</div>
  <div class="sp"></div>
  <button class="ibtn" id="btnSound" title="Sonido">🔊</button>
  <button class="ibtn" id="btnReset" title="Reiniciar mi dino (solo demo)">↺</button>
 </header>

 <aside id="rank">
  <h2>🏆 Ranking de daño</h2>
  <small>Quién ha lastimado más al dino</small>
  <div id="rankList"></div>
  <div id="you"></div>
  <div id="mode"></div>
 </aside>

 <main>
  <div id="stage">
   <div id="hud"><div id="total">0<small>golpes totales</small></div><div id="combo"></div></div>
   <div id="bubble"></div>
   <svg id="svg" viewBox="0 0 600 700" role="img" aria-label="Dinosaurio con alas"></svg>
   <canvas id="fx"></canvas>
   <div id="tip"></div>
   <div id="legend">Haz click en cualquier parte del cuerpo · izquierda/derecha según tu pantalla</div>
  </div>
  <div id="toast"></div>
 </main>
</div>

<div id="modal">
 <form id="nickForm">
  <h1>🔥 Dino Rage</h1>
  <p>Elige tu apodo, conoce a tu dinosaurio y demuestra quién golpea más.</p>
  <input id="nickIn" maxlength="16" minlength="2" placeholder="Tu apodo" autocomplete="off" required>
  <button class="go" type="submit">¡Entrar a la arena!</button>
 </form>
</div>

<script>
/* =====================  CONFIG  ===================== */
const SUPABASE_URL = 'https://yuxvlnemejdhpdlzrhtz.supabase.co';   // https://xxxx.supabase.co  (vacío = modo demo con bots)
const SUPABASE_KEY = 'sb_publishable_njMdeGK5IKRoyZUR9-hY4g_o-KUgsNJ';   // clave anon public
/* ==================================================== */

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const OUT = '#7d2209';
const lerp = (a,b,t) => a + (b-a)*t;
const clamp = (v,a=0,b=1) => Math.max(a,Math.min(b,v));
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=hash(String(seed));return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mix(c1,c2,t){const p=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));const a=p(c1),b=p(c2);return'#'+a.map((v,i)=>Math.round(lerp(v,b[i],t)).toString(16).padStart(2,'0')).join('')}

/* ---------- Definición de partes ---------- */
const NAMES = {head:'Cabeza',torso:'Tronco',wing:'Ala',arm:'Brazo',hand:'Mano',leg:'Pierna',foot:'Pie'};
const KEYS = ['head','torso','wingL','wingR','armL','armR','handL','handR','legL','legR','footL','footR'];
const label = k => k.endsWith('L') ? NAMES[k.slice(0,-1)]+' izquierda' : k.endsWith('R') ? NAMES[k.slice(0,-1)]+' derecha' : NAMES[k];
const THRESH = [3,10,22,40,70];
const lvl = n => THRESH.filter(t=>n>=t).length;

const G = {
 wing:'M222 372 C178 340 120 292 62 224 C52 262 66 290 88 306 C74 318 80 338 100 346 C98 362 116 372 134 374 C152 392 190 402 226 406Z',
 tail:'M385 470 C462 468 532 520 522 598 C518 626 492 640 470 630 C490 604 482 566 442 546 C418 534 398 542 386 548Z'
};
const sk=(tag,a,fill='url(#gSkin)')=>`<${tag} ${a} fill="${fill}" stroke="${OUT}" stroke-width="4" stroke-linejoin="round"/><${tag} ${a} fill="url(#pTex)" opacity=".75"/><${tag} ${a} fill="url(#gShade)"/>`;
const claw=d=>`<path d="${d}" fill="#fff6dc" stroke="${OUT}" stroke-width="2.5" stroke-linejoin="round"/>`;

const DEF = {
 wing:{tag:'path',a:`d="${G.wing}"`,c:[130,330,55],draw(){return `
   <path d="${G.wing}" fill="url(#gWing)" stroke="${OUT}" stroke-width="4" stroke-linejoin="round"/>
   <path d="${G.wing}" fill="url(#pTex)" opacity=".5"/>
   <path d="M222 385 L66 228 M222 392 L90 308 M222 398 L102 348" stroke="${OUT}" stroke-width="11" stroke-linecap="round" fill="none"/>
   <path d="M222 385 L66 228 M222 392 L90 308 M222 398 L102 348" stroke="#f26a24" stroke-width="6" stroke-linecap="round" fill="none"/>
   <path d="M222 385 L66 228" stroke="#ffc07a" stroke-width="2" stroke-linecap="round" fill="none" opacity=".7"/>
   <circle cx="64" cy="226" r="8" fill="#fff3d6" stroke="${OUT}" stroke-width="3"/>`}},
 arm:{tag:'ellipse',a:'cx="202" cy="422" rx="24" ry="48" transform="rotate(32 202 422)"',c:[202,422,32],draw(){return sk('ellipse','cx="202" cy="422" rx="24" ry="48" transform="rotate(32 202 422)"')}},
 hand:{tag:'circle',a:'cx="172" cy="470" r="25"',c:[172,470,22],draw(){return claw('M153 487 L156 507 L166 490Z')+claw('M165 492 L172 512 L181 493Z')+claw('M178 490 L188 508 L193 486Z')+sk('circle','cx="172" cy="470" r="25"')}},
 leg:{tag:'ellipse',a:'cx="245" cy="525" rx="56" ry="70"',c:[245,525,45],draw(){return sk('ellipse','cx="245" cy="525" rx="56" ry="70"')+`<ellipse cx="232" cy="500" rx="14" ry="22" fill="#fff" opacity=".13"/>`}},
 foot:{tag:'ellipse',a:'cx="228" cy="614" rx="54" ry="26"',c:[228,614,36],draw(){return claw('M190 628 L193 647 L205 632Z')+claw('M216 636 L225 655 L235 637Z')+claw('M244 632 L257 649 L263 628Z')+sk('ellipse','cx="228" cy="614" rx="54" ry="26"')}},
 head:{tag:'ellipse',a:'cx="300" cy="235" rx="124" ry="106"',c:[300,235,88]},
 torso:{tag:'ellipse',a:'cx="300" cy="430" rx="108" ry="128"',c:[300,430,85]}
};

/* ---------- Overlays de daño por parte ---------- */
function overlays(name,c){
 const [cx,cy,r]=c, rnd=rng(name);
 const P=()=>[cx+(rnd()-.5)*r*1.3,cy+(rnd()-.5)*r*1.3];
 const scratch=min=>{const [x,y]=P(),a=rnd()*Math.PI*2,l=r*(.5+rnd()*.5),x2=x+Math.cos(a)*l,y2=y+Math.sin(a)*l;
  return `<g data-min="${min}"><path d="M${x} ${y} L${x2} ${y2}" stroke="#5a1304" stroke-width="3" stroke-linecap="round"/><path d="M${x+2.5} ${y+2.5} L${x2+2.5} ${y2+2.5}" stroke="#ff9d8a" stroke-width="1.3" stroke-linecap="round" opacity=".7"/>
  <path d="M${x+(x2-x)*.3} ${y+(y2-y)*.3} l6 -7 M${x+(x2-x)*.6} ${y+(y2-y)*.6} l-6 7" stroke="#5a1304" stroke-width="2" stroke-linecap="round"/></g>`};
 const bruise=(min,k)=>{const [x,y]=P();return `<ellipse data-min="${min}" cx="${x}" cy="${y}" rx="${r*.38*k}" ry="${r*.28*k}" fill="url(#gBruise)" filter="url(#blur3)" transform="rotate(${rnd()*180} ${x} ${y})"/>`};
 const bandage=min=>{const [x,y]=P(),a=(rnd()-.5)*70,w=r*1.25,h=Math.max(13,r*.34);
  return `<g data-min="${min}" transform="rotate(${a} ${x} ${y})"><rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="${h/2.6}" fill="#fff3d6" stroke="#b98d55" stroke-width="2.5"/>
  <rect x="${x-w*.18}" y="${y-h/2+2}" width="${w*.36}" height="${h-4}" fill="#f2d9a6"/>
  ${[-.38,-.3,.3,.38].map(k=>`<circle cx="${x+w*k}" cy="${y}" r="1.4" fill="#c9a36a"/>`).join('')}</g>`};
 const crack=min=>{const [x,y]=P();let d=`M${x} ${y}`,px=x,py=y;for(let i=0;i<5;i++){px+=(rnd()-.35)*r*.32;py+=(rnd()*.3+.12)*r*.4;d+=` L${px} ${py}`}
  return `<g data-min="${min}"><path d="${d}" stroke="#2c0a00" stroke-width="3" fill="none" stroke-linejoin="round"/><path d="${d}" stroke="#ff8a4a" stroke-width="1" fill="none" opacity=".6" transform="translate(1.5 1.5)"/></g>`};
 const soot=min=>{const [x,y]=P();return `<ellipse data-min="${min}" cx="${x}" cy="${y}" rx="${r*.5}" ry="${r*.38}" fill="#1b0802" opacity=".38" filter="url(#blur6)"/>`};
 return scratch(1)+`<circle data-min="1" cx="${P()[0]}" cy="${P()[1]}" r="${r*.2}" fill="#ff5a4a" opacity=".35" filter="url(#blur3)"/>`
  +bruise(2,1)+scratch(2)+scratch(2)+bandage(3)+scratch(3)+crack(4)+soot(4)+bruise(4,1.3)
  +`<ellipse data-min="5" cx="${cx}" cy="${cy}" rx="${r*1.05}" ry="${r*1.05}" fill="#3a2a2a" opacity=".28" filter="url(#blur6)"/>`
  +bandage(5)+crack(5)+bruise(5,1.5)+scratch(5);
}

/* ---------- Construcción del SVG ---------- */
function eye(){return `<g class="eye"><g class="eyeball">
 <ellipse class="sclera" cx="252" cy="228" rx="27" ry="31" fill="#fff" stroke="${OUT}" stroke-width="3.5"/>
 <g clip-path="url(#eyeClip)">
  <circle class="iris" cx="257" cy="234" r="19" fill="#2aa6c9"/><circle cx="257" cy="234" r="19" fill="url(#gIris)"/>
  <ellipse class="pupil" cx="257" cy="234" rx="9" ry="10" fill="#10161c"/>
  <circle class="hl" cx="249" cy="223" r="6.5" fill="#fff"/><circle class="hl" cx="264" cy="242" r="3" fill="#fff"/>
  <polygon class="lid" points="215,180 295,180 295,180 215,180" fill="#f78f33" stroke="${OUT}" stroke-width="4" stroke-linejoin="round"/>
 </g></g>
 <path class="brow" d="" stroke="${OUT}" fill="none" stroke-linecap="round" opacity="0"/></g>`}

function mirror(inner){return `<g transform="translate(600 0) scale(-1 1)">${inner}</g>`}
function sidePart(base,side){
 const d=DEF[base],key=base+side;
 const g=`<g class="part" data-part="${key}"><g class="shape">${d.draw()}</g><g class="dmg" clip-path="url(#clip-${base})">${overlays(key,d.c)}</g></g>`;
 return side==='R'?mirror(g):g;
}

function buildSVG(){
 const clips=Object.entries(DEF).map(([k,d])=>`<clipPath id="clip-${k}"><${d.tag} ${d.a}/></clipPath>`).join('');
 const defs=`<defs>
  <radialGradient id="gSkin" cx=".38" cy=".3" r=".85"><stop offset="0" stop-color="#ffb457"/><stop offset=".55" stop-color="#f5802c"/><stop offset="1" stop-color="#d9501a"/></radialGradient>
  <radialGradient id="gSkinL" cx=".4" cy=".3" r=".9"><stop offset="0" stop-color="#ffc474"/><stop offset="1" stop-color="#f58a30"/></radialGradient>
  <radialGradient id="gBelly" cx=".4" cy=".25" r=".9"><stop offset="0" stop-color="#fff0bf"/><stop offset="1" stop-color="#f2c06e"/></radialGradient>
  <linearGradient id="gShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".12"/><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#5a1000" stop-opacity=".38"/></linearGradient>
  <linearGradient id="gWing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6a3a"/><stop offset="1" stop-color="#8f1f3a"/></linearGradient>
  <linearGradient id="gSpike" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe3a0"/><stop offset="1" stop-color="#c9441a"/></linearGradient>
  <radialGradient id="gIris" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></radialGradient>
  <radialGradient id="gBruise"><stop offset="0" stop-color="#5b2a7a" stop-opacity=".9"/><stop offset=".6" stop-color="#7a3a6a" stop-opacity=".5"/><stop offset="1" stop-color="#7a3a6a" stop-opacity="0"/></radialGradient>
  <radialGradient id="gGround"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter><filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
  <pattern id="pTex" width="160" height="160" patternUnits="userSpaceOnUse"><image id="texImg" width="160" height="160"/></pattern>
  <clipPath id="eyeClip"><ellipse cx="252" cy="228" rx="27" ry="31"/></clipPath>${clips}</defs>`;

 const flame=`<g class="flame"><g id="flameScale" style="transform-origin:476px 640px">
  <ellipse cx="476" cy="600" rx="44" ry="56" fill="#ff7a1a" opacity=".35" filter="url(#glow)" id="flameGlow"/>
  <path id="flameOut" d="M476 644 C440 622 450 584 474 552 C480 580 506 588 500 620 C497 636 486 646 476 644Z" fill="#ff8a1f" stroke="#a62a08" stroke-width="3" stroke-linejoin="round"/>

const cv=$('#fx'),cx=cv.getContext('2d');let W=0,H=0,DPR=1;const PS=[];

addEventListener('resize',resize);
function burst(x,y,n,o={}){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=(o.speed||240)*(.3+Math.random());
 PS.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(o.up||80),g:o.g??700,life:0,max:(o.life||.7)*(.6+Math.random()*.7),r:(o.r||4)*(.5+Math.random()),c:o.c||['#ffd36b','#ff8a1f','#fff3b0'][i%3],star:o.star&&Math.random()<.5,rot:Math.random()*6})}}
function ember(x,y){PS.push({x,y,vx:(Math.random()-.5)*30,vy:-40-Math.random()*60,g:-20,life:0,max:1.2+Math.random(),r:1.5+Math.random()*2,c:Math.random()<.5?'#ffb347':'#ff5a1a',star:false,rot:0})}
let lastT=performance.now();
function loop(t){const dt=Math.min(.05,(t-lastT)/1000);lastT=t;cx.clearRect(0,0,W,H);
 const A=state?anger():0;
 if(state&&Math.random()<.1+A*.35){const f=$('#flameIn').getBoundingClientRect(),s=$('#stage').getBoundingClientRect();ember(f.left-s.left+f.width/2,f.top-s.top+f.height*.3)}
 cx.globalCompositeOperation='lighter';
 for(let i=PS.length-1;i>=0;i--){const p=PS[i];p.life+=dt;if(p.life>p.max){PS.splice(i,1);continue}
  p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;const k=1-p.life/p.max;cx.globalAlpha=k;cx.fillStyle=p.c;
  if(p.star){cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot+p.life*6);cx.beginPath();for(let j=0;j<8;j++){const rr=j%2?p.r*.5:p.r*1.6,a=j*Math.PI/4;cx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}cx.fill();cx.restore()}
  else{cx.beginPath();cx.arc(p.x,p.y,p.r*(.4+k*.6),0,7);cx.fill()}}
 cx.globalAlpha=1;cx.globalCompositeOperation='source-over';requestAnimationFrame(loop)}

 const t=todayStr();if(s.last!==t){const y=new Date(Date.now()-864e5).toISOString().slice(0,10);s.n=s.last===y?s.n+1:1;s.last=t;try{localStorage.setItem('dinorage_streak_'+nick.toLowerCase(),JSON.stringify(s))}catch(e){}}
 $('#chipStreak').textContent='🔥 Racha: '+s.n+(s.n===1?' día':' días')}

/* ---------- Inicio ---------- */
function start(n){
 nick=n.trim().slice(0,16);try{localStorage.setItem('dinorage_nick',nick)}catch(e){}
 state=load();$('#chipNick').textContent='👤 '+nick;$('#modal').style.display='none';
 KEYS.forEach(updatePart);updateFace();renderTotal();streak();Rank.init();resize();
 setTimeout(()=>say('¡Hola, '+nick+'! 🧡'),500);
}
buildSVG();makeTexture();resize();requestAnimationFrame(loop);
let saved='';try{saved=localStorage.getItem('dinorage_nick')||''}catch(e){}
$('#nickIn').value=saved;
$('#nickForm').addEventListener('submit',e=>{e.preventDefault();if($('#nickIn').value.trim().length>=2)start($('#nickIn').value)});
</script>
